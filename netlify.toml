# netlify.toml
# Netlify deployment configuration for NetLocate

[build]
  publish = "."   # Root of the project is the publish directory

# Redirect rules: serve index.html for all non-file routes (SPA behaviour)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' https://unpkg.com https://www.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://*.openstreetmap.org https://nominatim.openstreetmap.org https://lh3.googleusercontent.com https://ui-avatars.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://nominatim.openstreetmap.org wss://*.firebaseio.com; frame-src 'none';"
